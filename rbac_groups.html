<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>培训公司 OA - rbac_groups</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>html[data-embedded="1"] .oa-sidebar{display:none!important;}html[data-embedded="1"] .oa-layout{display:block!important;}html[data-embedded="1"] .oa-main{padding:12px 16px!important;}html[data-embedded="1"] .oa-header{position:static!important;padding-left:0!important;}html[data-embedded="1"] .header-actions a.btn-secondary{display:none!important;}html[data-embedded="1"] .menu-toggle,html[data-embedded="1"] .sidebar-overlay{display:none!important;}</style><script>(function(){var p=new URLSearchParams(location.search);if(p.get("embedded")==="1"){document.documentElement.setAttribute("data-embedded","1");}})();</script></head>
<body>
<div id="app" class="oa-layout" :class="{'mobile': isMobile, 'sidebar-open': sidebarOpen}" v-cloak>
  <aside class="oa-sidebar" :class="{'open': sidebarOpen}">
    <div class="brand">培训公司 OA</div>
    <div class="user-box">{{ user.real_name || user.username }}（{{ user.role || '访客' }}）</div>
    <button v-if="isMobile && sidebarOpen" class="sidebar-close" @click="sidebarOpen=false" aria-label="收起菜单">×</button>
    <template v-for="group in groupedMenus" :key="group.parent">
      <div class="group-title">{{ group.parent }}</div>
      <ul class="menu-tree simple">
        <li v-for="m in group.children" :key="m.id" :class="{active:activeTab===m.menu_key}" @click="selectMenu(m.menu_key)">{{ m.menu_name }}</li>
      </ul>
    </template>
  </aside>
  <div v-if="isMobile && sidebarOpen" class="sidebar-overlay" @click="sidebarOpen=false"></div>

  <main class="oa-main">
    <header class="oa-header">
      <button v-if="isMobile" class="menu-toggle" @click="toggleSidebar" aria-label="切换菜单">☰</button>
      <h1>OA 系统管理台</h1>
      <div class="header-actions">
        <button class="btn-secondary" @click="reloadAll">刷新数据</button>
        <button class="btn-secondary" v-if="canImportExportTab()" @click="exportCurrentTab">导出Excel(CSV)</button>
        <button class="btn-secondary" v-if="canImportExportTab()" @click="triggerImport">导入Excel(CSV)</button>
        <input ref="importFileRef" type="file" accept=".csv" style="display:none" @change="handleImportFile">
        <button class="btn-danger" @click="logout">退出登录</button>
      </div>
    </header>

    <section class="content-card" v-if="activeTab==='rbac_groups'">
      <h2>系统管理 / 角色管理</h2>
      <p class="role-tip"><strong>岗位引导：</strong>按岗位建立角色模板（顾问/班主任/教练/财务/人事/老板），避免直接给个人配置过多权限。</p>
      <div class="section-actions"><button type="button" @click="openEditor('group', false)">新增角色</button></div><form :class="['inline-form','editor-form',{show:activeEditor==='group'}]" @submit.prevent="saveGroup"><input v-model.trim="groupForm.group_name" placeholder="角色名" required><input v-model.trim="groupForm.group_code" placeholder="组编码" required><input v-model.trim="groupForm.remark" placeholder="备注"><button>{{groupForm.id?'保存角色':'新增角色'}}</button><button type="button" class="btn-secondary" @click="closeEditor">取消</button></form>
      <table class="table"><thead><tr><th>ID</th><th>角色名</th><th>编码</th><th>备注</th><th>操作</th></tr></thead><tbody><tr v-for="g in groups" :key="g.id"><td>{{g.id}}</td><td>{{g.group_name}}</td><td>{{g.group_code}}</td><td>{{g.remark}}</td><td><button class="btn-mini" @click="editGroup(g)">编辑</button></td></tr></tbody></table>
    </section>

    <div class="editor-overlay" v-if="activeEditor" @click="closeEditor"></div>
    <div class="detail-modal" v-if="detailDialog.open" @click.self="closeDetailDialog"><div class="detail-card"><h3>{{ detailDialog.title }}</h3><pre>{{ detailDialog.content }}</pre><button class="btn-secondary" @click="closeDetailDialog">关闭</button></div></div>
    <p v-if="error" class="error global-error">{{ error }}</p>
  </main>
</div>

    const csvEscape=(v)=>{const t=String(v??''); if(/[",\n]/.test(t)) return '"'+t.replace(/"/g,'""')+'"'; return t;};
    const toCsv=(rows)=>{if(!rows.length) return ''; const headers=[...new Set(rows.flatMap(r=>Object.keys(r||{})))]; const lines=[headers.join(',')]; rows.forEach(r=>lines.push(headers.map(h=>csvEscape(r?.[h]??'')).join(','))); return '\uFEFF'+lines.join('\n');};
    const parseCsvLine=(line)=>{const out=[]; let cur=''; let q=false; for(let i=0;i<line.length;i++){const ch=line[i]; if(ch==='"'){ if(q && line[i+1]==='"'){cur+='"'; i++;} else {q=!q;} } else if(ch===',' && !q){out.push(cur); cur='';} else {cur+=ch;} } out.push(cur); return out;};
    const splitCsvRows=(text)=>{const rows=[]; let cur=''; let q=false; for(let i=0;i<text.length;i++){const ch=text[i]; if(ch==='"'){ if(q && text[i+1]==='"'){cur+='""'; i++;} else {q=!q; cur+=ch;} } else if((ch==='\n'||ch==='\r') && !q){ if(ch==='\r' && text[i+1]==='\n') i++; if(cur.trim()!=='') rows.push(cur); cur=''; } else {cur+=ch;} } if(cur.trim()!=='') rows.push(cur); return rows;};
    const fromCsv=(text)=>{const rows=splitCsvRows(text.replace(/^\uFEFF/,'')); if(!rows.length) return []; const headers=parseCsvLine(rows[0]); return rows.slice(1).map(l=>{const vals=parseCsvLine(l); const o={}; headers.forEach((h,i)=>o[h]=vals[i]??''); return o;});};
    const normalizeSlashDate=(v)=>{if(typeof v!=='string') return v; const t=v.trim(); if(!t||!t.includes('/')) return v; const m=t.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?$/); if(!m) return v; const y=m[1]; const mm=m[2].padStart(2,'0'); const dd=m[3].padStart(2,'0'); if(!m[4]) return `${y}-${mm}-${dd}`; const hh=m[4].padStart(2,'0'); const mi=m[5].padStart(2,'0'); const ss=(m[6]||'00').padStart(2,'0'); return `${y}-${mm}-${dd} ${hh}:${mi}:${ss}`;};
    const cleanImportRow=(row)=>{const o={...row}; delete o.id; delete o.created_at; delete o.updated_at; Object.keys(o).forEach(k=>{o[k]=normalizeSlashDate(o[k]);}); if('enrolled_courses' in o && typeof o.enrolled_courses==='string' && o.enrolled_courses.trim().startsWith('[')){ try{o.enrolled_courses=JSON.parse(o.enrolled_courses);}catch(_){}}; return o;};
    const decodeImportFile=async(file)=>{const buf=await file.arrayBuffer(); try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(_){try{return new TextDecoder('gb18030').decode(buf);}catch(__){return new TextDecoder().decode(buf);}}};

    const exportCurrentTab=async()=>{

        const rows=conf.list(data)||[];
        const blob=new Blob([toCsv(rows)],{type:'text/csv;charset=utf-8;'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download=`${activeTab.value}_all.csv`;
        document.body.appendChild(a); a.click(); a.remove();
      }catch(e){error.value=e.message;}
    };

    const handleImportFile=async(ev)=>{
      const f=ev.target.files&&ev.target.files[0];
      if(!f) return;
      if(!confirm('导入会先删除当前页面全部旧数据，再导入新数据，是否继续？')) return;
      error.value='';
      try{
        const conf=ioConfig[activeTab.value];
        const text=await decodeImportFile(f);
        const rows=fromCsv(text);
        const oldData=await api(conf.url);
        const oldRows=conf.list(oldData)||[];
        for(const r of oldRows){ if(r&&r.id!==undefined&&r.id!==null){ await api(`${conf.url}?id=${encodeURIComponent(r.id)}`,{method:'DELETE'}); } }
        for(const r of rows){ await api(conf.url,{method:'POST',body:JSON.stringify(cleanImportRow(r))}); }
        await reloadAll();
      }catch(e){error.value=e.message;}
    };
