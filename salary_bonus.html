<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奖金管理</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    html[data-embedded="1"] .oa-sidebar{display:none!important;}
    html[data-embedded="1"] .oa-layout{display:block!important;}
    html[data-embedded="1"] .oa-main{padding:12px 16px!important;}
    html[data-embedded="1"] .oa-header{position:static!important;padding-left:0!important;}
    html[data-embedded="1"] .header-actions a.btn-secondary{display:none!important;}
    html[data-embedded="1"] .menu-toggle,html[data-embedded="1"] .sidebar-overlay{display:none!important;}
    .filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
    .filter-bar select,.filter-bar input{padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;}
    .table-container{overflow-x:auto;}
    table{width:100%;border-collapse:collapse;font-size:14px;}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e5e7eb;}
    th{background:#f9fafb;font-weight:600;color:#374151;}
    tr:hover{background:#f9fafb;}
    .status-calculating{background:#eff6ff;color:#2563eb;padding:2px 8px;border-radius:4px;font-size:12px;}
    .status-confirmed{background:#fef3c7;color:#d97706;padding:2px 8px;border-radius:4px;font-size:12px;}
    .status-paid{background:#f0fdf4;color:#15803d;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-commission{background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-monthly{background:#eff6ff;color:#1e40af;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-quarterly{background:#f0fdf4;color:#166534;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-yearly{background:#fdf2f8;color:#9d174d;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-activity{background:#fff7ed;color:#9a3412;padding:2px 8px;border-radius:4px;font-size:12px;}
    .type-penalty{background:#fef2f2;color:#dc2626;padding:2px 8px;border-radius:4px;font-size:12px;}
    .btn-sm{padding:4px 10px;font-size:12px;margin-right:6px;}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
    .modal{background:#fff;border-radius:8px;width:500px;max-width:90%;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.1);}
    .modal h2{margin-top:0;margin-bottom:16px;color:#1f2937;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;margin-bottom:6px;font-weight:500;color:#374151;}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:14px;}
    .form-group textarea{resize:vertical;min-height:60px;}
    .modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;}
  </style>
  <script>
    (function(){
      var p = new URLSearchParams(location.search);
      if (p.get("embedded") === "1") document.documentElement.setAttribute("data-embedded","1");
    })();
  </script>
</head>
<body>
<div id="app" class="oa-layout">
  <main class="oa-main">
    <header class="oa-header">
      <h1>奖金管理</h1>
      <div class="header-actions">
        <button class="btn-primary" @click="showModal=true">新建奖金记录</button>
        <button class="btn-secondary" @click="loadData">刷新</button>
        <button class="btn-danger" @click="logout">退出</button>
      </div>
    </header>
    <section class="content-card">
      <div v-if="error" class="error-message">{{ error }}</div>
      <div v-else>
        <div class="filter-bar">
          <select v-model="filters.type" @change="filterData">
            <option value="">全部类型</option>
            <option value="订单提成">订单提成</option>
            <option value="月度奖金">月度奖金</option>
            <option value="季度奖金">季度奖金</option>
            <option value="年度奖金">年度奖金</option>
            <option value="活动奖励">活动奖励</option>
            <option value="惩罚">惩罚</option>
          </select>
          <select v-model="filters.status" @change="filterData">
            <option value="">全部状态</option>
            <option value="计算中">计算中</option>
            <option value="已确认">已确认</option>
            <option value="已发放">已发放</option>
          </select>
          <input v-model="filters.name" placeholder="搜索员工姓名" @input="filterData" />
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>记录ID</th>
                <th>员工姓名</th>
                <th>部门</th>
                <th>奖金类型</th>
                <th>对应月份/活动</th>
                <th>金额</th>
                <th>计算依据</th>
                <th>状态</th>
                <th>发放时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="item in filteredItems" :key="item.id">
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.department }}</td>
                <td><span :class="'type-'+item.typeClass">{{ item.bonusType }}</span></td>
                <td>{{ item.period }}</td>
                <td><strong>¥{{ item.amount.toLocaleString() }}</strong></td>
                <td>{{ item.basis }}</td>
                <td><span :class="'status-'+item.statusClass">{{ item.statusText }}</span></td>
                <td>{{ item.paidTime }}</td>
                <td>
                  <button v-if="item.status==='confirmed'" class="btn-sm btn-primary" @click="confirmPay(item.id)">发放</button>
                  <button v-if="item.status==='calculating'" class="btn-sm btn-secondary" @click="confirm(item.id)">确认</button>
                  <button class="btn-sm btn-secondary" @click="viewDetail(item.id)">详情</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</div>

<div v-if="showModal" class="modal-overlay" @click.self="showModal=false">
  <div class="modal">
    <h2>新建奖金记录</h2>
    <div class="form-group">
      <label>员工姓名</label>
      <input v-model="form.name" placeholder="请输入员工姓名" />
    </div>
    <div class="form-group">
      <label>部门</label>
      <select v-model="form.department">
        <option value="">请选择部门</option>
        <option>销售部</option>
        <option>教务部</option>
        <option>运营部</option>
      </select>
    </div>
    <div class="form-group">
      <label>奖金类型</label>
      <select v-model="form.bonusType">
        <option value="">请选择奖金类型</option>
        <option value="订单提成">订单提成</option>
        <option value="月度奖金">月度奖金</option>
        <option value="季度奖金">季度奖金</option>
        <option value="年度奖金">年度奖金</option>
        <option value="活动奖励">活动奖励</option>
        <option value="惩罚">惩罚</option>
      </select>
    </div>
    <div class="form-group">
      <label>对应月份/活动</label>
      <input v-model="form.period" placeholder="如：2026-03 或 春季招生活动" />
    </div>
    <div class="form-group">
      <label>金额(元)</label>
      <input v-model.number="form.amount" type="number" />
    </div>
    <div class="form-group">
      <label>计算依据</label>
      <textarea v-model="form.basis" placeholder="请输入计算依据或说明"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" @click="showModal=false">取消</button>
      <button class="btn-primary" @click="submitForm">提交</button>
    </div>
  </div>
</div>

<script>
const { createApp, ref, reactive, computed, onMounted } = Vue;
createApp({
  setup() {
    const items = ref([]);
    const filteredItems = ref([]);
    const error = ref('');
    const showModal = ref(false);
    const filters = reactive({ type: '', status: '', name: '' });
    const form = reactive({
      name: '', department: '', bonusType: '', period: '', amount: 0, basis: ''
    });
    const api = async(url, opt={}) => {
      const token = localStorage.getItem('oa_token') || '';
      const headers = {'Content-Type':'application/json'};
      if (token) { headers['Authorization'] = 'Bearer ' + token; headers['X-OA-Token'] = token; }
      let r;
      try { r = await fetch(url, {...opt, headers}); }
      catch(e) { throw new Error('网络异常'); }
      const j = await r.json();
      if (r.status === 401) { localStorage.removeItem('oa_token'); top.location.href = './login.html'; throw new Error('登录过期'); }
      if (j.code !== 0) throw new Error(j.message || '请求失败');
      return j.data;
    };
    const loadData = async() => {
      error.value = '';
      try { items.value = await api('/api/salary_bonus.php'); filteredItems.value = [...items.value]; }
      catch(e) { error.value = e.message; }
    };
    const filterData = () => {
      filteredItems.value = items.value.filter(item => {
        if (filters.type && item.bonusType !== filters.type) return false;
        if (filters.status && item.status !== filters.status) return false;
        if (filters.name && !item.name.includes(filters.name)) return false;
        return true;
      });
    };
    const submitForm = async() => {
      try {
        await api('/api/salary_bonus.php', { method:'POST', body:JSON.stringify({ action:'create', ...form }) });
        showModal.value = false;
        await loadData();
      } catch(e) { alert(e.message); }
    };
    const confirm = async(id) => {
      try { await api('/api/salary_bonus.php', { method:'POST', body:JSON.stringify({ action:'confirm', id }) }); await loadData(); }
      catch(e) { alert(e.message); }
    };
    const confirmPay = async(id) => {
      try { await api('/api/salary_bonus.php', { method:'POST', body:JSON.stringify({ action:'pay', id }) }); await loadData(); }
      catch(e) { alert(e.message); }
    };
    const viewDetail = (id) => { alert('查看详情: '+id); };
    const logout = () => { localStorage.removeItem('oa_token'); localStorage.removeItem('oa_user'); top.location.href = './login.html'; };
    onMounted(async() => { if (!localStorage.getItem('oa_token')) { top.location.href = './login.html'; return; } await loadData(); });
    return { items, filteredItems, error, filters, showModal, form, loadData, filterData, submitForm, confirm, confirmPay, viewDetail, logout };
  }
}).mount('#app');
</script>
</body>
</html>
