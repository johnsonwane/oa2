<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>OA 仪表盘(H5)</title><link rel="stylesheet" href="./assets/style.css"/><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script></head><body>
<div id="app" class="page"><div class="card"><h1>仪表盘</h1><p class="subtitle">欢迎你，{{username}}</p><div class="panel"><h2>系统状态</h2><ul><li>前端：<code>/h5</code></li><li>后端：<code>/api/login.php</code></li><li>令牌：<code>{{token}}</code></li></ul></div><button @click="logout">退出登录</button></div></div>
<script>const {createApp,ref,onMounted}=Vue;createApp({setup(){const username=ref(''),token=ref('');onMounted(()=>{const t=localStorage.getItem('oa_token'),u=localStorage.getItem('oa_username');if(!t||!u){location.href='./login.html';return;}token.value=t;username.value=u;});const logout=()=>{localStorage.removeItem('oa_token');localStorage.removeItem('oa_username');location.href='./login.html'};return{username,token,logout}}}).mount('#app')</script>
</body></html>
