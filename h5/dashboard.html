<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OA 仪表盘(H5)</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="page page-top">
    <div class="card card-wide">
      <h1>仪表盘菜单管理</h1>
      <p class="subtitle">欢迎你，{{ username }}</p>

      <form class="form form-grid" @submit.prevent="submitMenu">
        <label>菜单名称<input v-model.trim="form.menu_name" required /></label>
        <label>菜单标识<input v-model.trim="form.menu_key" required /></label>
        <label>菜单路径<input v-model.trim="form.path" required /></label>
        <label>图标<input v-model.trim="form.icon" placeholder="可选" /></label>
        <label>排序<input v-model.number="form.sort_no" type="number" /></label>
        <label>状态
          <select v-model.number="form.status">
            <option :value="1">启用</option>
            <option :value="0">禁用</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">{{ form.id ? '保存修改' : '新增菜单' }}</button>
          <button type="button" class="btn-secondary" @click="resetForm">重置</button>
          <button type="button" class="btn-danger" @click="logout">退出登录</button>
        </div>
      </form>

      <p v-if="error" class="error">{{ error }}</p>

      <div class="panel">
        <h2>菜单列表</h2>
        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>名称</th><th>标识</th><th>路径</th><th>排序</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="row in list" :key="row.id">
              <td>{{ row.id }}</td>
              <td>{{ row.menu_name }}</td>
              <td>{{ row.menu_key }}</td>
              <td><code>{{ row.path }}</code></td>
              <td>{{ row.sort_no }}</td>
              <td>{{ row.status === 1 ? '启用' : '禁用' }}</td>
              <td>
                <button class="btn-mini" @click="editRow(row)">编辑</button>
                <button class="btn-mini btn-danger" @click="removeRow(row.id)">删除</button>
              </td>
            </tr>
            <tr v-if="list.length === 0"><td colspan="7">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
      setup() {
        const username = ref('');
        const token = ref('');
        const error = ref('');
        const list = ref([]);
        const form = reactive({ id: 0, menu_name: '', menu_key: '', path: '', icon: '', sort_no: 0, status: 1 });

        const api = async (url, options = {}) => {
          const response = await fetch(url, {
            headers: { 'Content-Type': 'application/json' },
            ...options
          });
          const data = await response.json();
          if (!response.ok || data.code !== 0) throw new Error(data.message || '请求失败');
          return data;
        };

        const loadMenus = async () => {
          try {
            const res = await api('/api/menu.php');
            list.value = res.data || [];
          } catch (e) {
            error.value = e.message;
          }
        };

        const resetForm = () => {
          form.id = 0; form.menu_name = ''; form.menu_key = ''; form.path = ''; form.icon = ''; form.sort_no = 0; form.status = 1;
        };

        const submitMenu = async () => {
          error.value = '';
          try {
            if (form.id) {
              await api('/api/menu.php', { method: 'PUT', body: JSON.stringify(form) });
            } else {
              await api('/api/menu.php', { method: 'POST', body: JSON.stringify(form) });
            }
            resetForm();
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        };

        const editRow = (row) => {
          form.id = Number(row.id);
          form.menu_name = row.menu_name;
          form.menu_key = row.menu_key;
          form.path = row.path;
          form.icon = row.icon || '';
          form.sort_no = Number(row.sort_no || 0);
          form.status = Number(row.status || 0);
        };

        const removeRow = async (id) => {
          if (!confirm('确认删除该菜单吗？')) return;
          error.value = '';
          try {
            await api(`/api/menu.php?id=${id}`, { method: 'DELETE' });
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        };

        const logout = () => {
          localStorage.removeItem('oa_token');
          localStorage.removeItem('oa_username');
          location.href = './login.html';
        };

        onMounted(async () => {
          const t = localStorage.getItem('oa_token');
          const u = localStorage.getItem('oa_username');
          if (!t || !u) {
            location.href = './login.html';
            return;
          }
          token.value = t;
          username.value = u;
          await loadMenus();
        });

        return { username, token, error, list, form, submitMenu, editRow, removeRow, resetForm, logout };
      }
    }).mount('#app');
  </script>
</body>
</html>
