<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>培训公司 OA 仪表盘(H5)</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="oa-layout" v-cloak>
    <aside class="oa-sidebar">
      <div class="brand">培训公司 OA</div>
      <div class="user-box">当前用户：{{ username }}</div>

      <div class="menu-section" v-for="group in menuTree" :key="group.name">
        <div class="group-title">{{ group.name }}</div>
        <ul class="menu-tree">
          <li v-for="item in group.children" :key="item" :title="item">{{ item }}</li>
        </ul>
      </div>
    </aside>

    <main class="oa-main">
      <header class="oa-header">
        <h1>菜单管理（按你给定的 OA 菜单清单）</h1>
        <div class="header-actions">
          <button class="btn-secondary" @click="seedDefaultMenus">初始化菜单到数据库</button>
          <button class="btn-danger" @click="logout">退出登录</button>
        </div>
      </header>

      <section class="content-card">
        <form class="form form-grid" @submit.prevent="submitMenu">
          <label>菜单名称<input v-model.trim="form.menu_name" required /></label>
          <label>菜单标识<input v-model.trim="form.menu_key" required /></label>
          <label>菜单路径<input v-model.trim="form.path" required /></label>
          <label>图标<input v-model.trim="form.icon" placeholder="可选" /></label>
          <label>排序<input v-model.number="form.sort_no" type="number" /></label>
          <label>状态
            <select v-model.number="form.status">
              <option :value="1">启用</option>
              <option :value="0">禁用</option>
            </select>
          </label>
          <div class="actions">
            <button type="submit">{{ form.id ? '保存修改' : '新增菜单' }}</button>
            <button type="button" class="btn-secondary" @click="resetForm">重置</button>
          </div>
        </form>

        <p v-if="error" class="error">{{ error }}</p>

        <table class="table">
          <thead>
            <tr>
              <th>ID</th><th>名称</th><th>标识</th><th>路径</th><th>排序</th><th>状态</th><th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="row in list" :key="row.id">
              <td>{{ row.id }}</td>
              <td>{{ row.menu_name }}</td>
              <td>{{ row.menu_key }}</td>
              <td><code>{{ row.path }}</code></td>
              <td>{{ row.sort_no }}</td>
              <td>{{ Number(row.status) === 1 ? '启用' : '禁用' }}</td>
              <td>
                <button class="btn-mini" @click="editRow(row)">编辑</button>
                <button class="btn-mini btn-danger" @click="removeRow(row.id)">删除</button>
              </td>
            </tr>
            <tr v-if="list.length === 0"><td colspan="7">暂无数据</td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
      setup() {
        const username = ref('');
        const error = ref('');
        const list = ref([]);
        const form = reactive({ id: 0, menu_name: '', menu_key: '', path: '', icon: '', sort_no: 0, status: 1 });

        const menuTree = ref([
          { name: '无', children: ['登录页'] },
          { name: '0级', children: ['首页', '我的'] },
          { name: '我的', children: ['个人信息修改', '修改密码', '我的消息/通知', '我的待办汇总', '我的日程'] },
          { name: '常用', children: ['我的待办', '待我审批', '今日/本周课程', '近期开班提醒', '销售线索/报名简讯', '个人业绩（讲师/销售/校区负责人）'] },
          { name: '运营', children: ['运营记录-查看', '运营记录-新增修改', '运营资料库-查看', '运营资料库-修改', '运营账号管理', '运营引流数据查看', '剪辑记录', '发帖记录', '运营素材库', '公号文管理'] },
          { name: '顾问', children: ['顾问发资料', '顾问发资料的记录', '顾问查看编辑客户', '顾问手动录入新客户', '顾问录入新订单', '学员录入', '学员修改', '学员查询-学员信息导出', '订单录入', '订单查询-订单信息导出', '订单修改', '顾问日报记录', '顾问工作统计', '班级管理-增改', '班级信息查询', '销课管理-增改', '销课查询'] },
          { name: '交付', children: ['班主任管理课程商品', '线下课交付记录'] },
          { name: '人力', children: ['HR管理花名册', '员工管理-添加', '员工管理-修改'] },
          { name: '财务', children: ['上报收款单', '上报支出单', '报销记录', '销售业绩统计', '教练业绩统计', '发票管理', '收款方管理', '自定义统计', '线下课单项目统计'] },
          { name: '行政', children: ['工作机号管理'] },
          { name: '系管', children: ['系统管理', '工具管理'] },
          { name: '超管', children: ['超管管理用户', '权限管理', '菜单管理', '导航栏管理', '部门管理', '公司管理', '合作方管理'] }
        ]);

        const api = async (url, options = {}) => {
          const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
          const data = await response.json();
          if (!response.ok || data.code !== 0) throw new Error(data.message || '请求失败');
          return data;
        };

        const loadMenus = async () => {
          const res = await api('/api/menu.php');
          list.value = res.data || [];
        };

        const resetForm = () => {
          form.id = 0; form.menu_name = ''; form.menu_key = ''; form.path = ''; form.icon = ''; form.sort_no = 0; form.status = 1;
        };

        const submitMenu = async () => {
          error.value = '';
          try {
            if (form.id) {
              await api('/api/menu.php', { method: 'PUT', body: JSON.stringify(form) });
            } else {
              await api('/api/menu.php', { method: 'POST', body: JSON.stringify(form) });
            }
            resetForm();
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        };

        const editRow = (row) => {
          form.id = Number(row.id);
          form.menu_name = row.menu_name;
          form.menu_key = row.menu_key;
          form.path = row.path;
          form.icon = row.icon || '';
          form.sort_no = Number(row.sort_no || 0);
          form.status = Number(row.status || 0);
        };

        const removeRow = async (id) => {
          if (!confirm('确认删除该菜单吗？')) return;
          error.value = '';
          try {
            await api(`/api/menu.php?id=${id}`, { method: 'DELETE' });
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        };

        const slug = (text) => text
          .replace(/\s+/g, '')
          .replace(/[\/（）()]/g, '-')
          .replace(/-+/g, '-')
          .replace(/[^\w\-\u4e00-\u9fa5]/g, '')
          .toLowerCase();

        const seedDefaultMenus = async () => {
          error.value = '';
          const unique = new Set();
          const rows = [];
          menuTree.value.forEach((group) => {
            group.children.forEach((child) => {
              const key = `${group.name}__${child}`;
              if (unique.has(key)) return;
              unique.add(key);
              rows.push({
                menu_name: `${group.name}/${child}`,
                menu_key: slug(key),
                path: `/${slug(group.name)}/${slug(child)}`,
                icon: '',
                status: 1
              });
            });
          });

          try {
            for (let i = 0; i < rows.length; i++) {
              try {
                await api('/api/menu.php', { method: 'POST', body: JSON.stringify({ ...rows[i], sort_no: i + 1 }) });
              } catch (e) {
                // 重复键等错误跳过，继续处理下一条
              }
            }
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        };

        const logout = () => {
          localStorage.removeItem('oa_token');
          localStorage.removeItem('oa_username');
          location.href = './login.html';
        };

        onMounted(async () => {
          const t = localStorage.getItem('oa_token');
          const u = localStorage.getItem('oa_username');
          if (!t || !u) {
            location.href = './login.html';
            return;
          }
          username.value = u;
          try {
            await loadMenus();
          } catch (e) {
            error.value = e.message;
          }
        });

        return { username, menuTree, error, list, form, submitMenu, editRow, removeRow, resetForm, logout, seedDefaultMenus };
      }
    }).mount('#app');
  </script>
</body>
</html>
