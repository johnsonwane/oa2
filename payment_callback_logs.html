<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OA-1.0.0</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    html[data-embedded="1"] .oa-sidebar{display:none!important;}
    html[data-embedded="1"] .oa-layout{display:block!important;}
    html[data-embedded="1"] .oa-main{padding:12px 16px!important;}
    html[data-embedded="1"] .oa-header{position:static!important;padding-left:0!important;}
    html[data-embedded="1"] .header-actions a.btn-secondary{display:none!important;}
    html[data-embedded="1"] .menu-toggle,html[data-embedded="1"] .sidebar-overlay{display:none!important;}html[data-embedded="1"] .oa-header h1{display:none!important;}
    .filters{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 14px;}
    .filters label{display:flex;align-items:center;gap:8px;}
    .filters input,.filters select{min-width:180px;}
  </style>
  <script>
    (function(){
      var p=new URLSearchParams(location.search);
      if(p.get('embedded')==='1') document.documentElement.setAttribute('data-embedded','1');
    })();
  </script>
</head>
<body>
<div class="oa-layout">
  <main>
    <div id="app" class="oa-main" v-cloak>
      <header class="oa-header">
        <h1>企微收款</h1>
        <div class="header-actions">
          <a class="btn-secondary" href="./index.html?page=todos" target="_top">返回主入口</a>
          <button @click="load">刷新</button>
        </div>
      </header>

      <section class="content-card">
        <p class="role-tip"><strong>查询范围：</strong>当前仅展示 <code>channel</code> 含“企微”/“企业微信” 的收款回调记录。</p>
        <div class="filters">
          <label>渠道关键词
            <input v-model.trim="keyword" type="text" placeholder="如：企微、哈广企微" />
          </label>
          <label>开始时间
            <input v-model="startAt" type="datetime-local" />
          </label>
          <label>结束时间
            <input v-model="endAt" type="datetime-local" />
          </label>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>渠道</th>
              <th>业务类型</th>
              <th>业务ID</th>
              <th>验签状态</th>
              <th>回调时间</th>
              <th>回调内容</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="row in filteredRows" :key="row.id">
              <td>{{ row.id || '-' }}</td>
              <td>{{ row.channel || '-' }}</td>
              <td>{{ row.biz_type || '-' }}</td>
              <td>{{ row.biz_id || '-' }}</td>
              <td>{{ row.verify_status || '-' }}</td>
              <td>{{ row.callback_time || '-' }}</td>
              <td><pre style="white-space:pre-wrap;max-width:500px">{{ row.callback_payload || '-' }}</pre></td>
            </tr>
            <tr v-if="!filteredRows.length"><td colspan="7" class="empty">暂无符合条件的企微收款记录</td></tr>
          </tbody>
        </table>
      </section>
    </div>
  </main>
</div>

<script>
const {createApp, ref, computed, onMounted} = Vue;
createApp({
  setup(){
    const rows = ref([]);
    const keyword = ref('企微');
    const startAt = ref('');
    const endAt = ref('');

    const api = async (url) => {
      const token = localStorage.getItem('oa_token') || '';
      const res = await fetch(url, {headers: token ? {Authorization:'Bearer '+token} : {}});
      const json = await res.json();
      if (!res.ok || json.code !== 0) throw new Error(json.message || '请求失败');
      return json.data;
    };

    const toTs = (v) => {
      if (!v) return null;
      const t = Date.parse(v.replace(' ', 'T'));
      return Number.isNaN(t) ? null : t;
    };

    const load = async()=>{
      const data = await api('/api/payment_callback_logs.php');
      rows.value = Array.isArray(data) ? data : [];
    };

    const filteredRows = computed(() => {
      const kw = keyword.value.trim();
      const s = toTs(startAt.value);
      const e = toTs(endAt.value);
      return rows.value.filter((r) => {
        const channel = String(r.channel || '');
        const isWecom = channel.includes('企微') || channel.toLowerCase().includes('wecom') || channel.includes('企业微信');
        if (!isWecom) return false;
        if (kw && !channel.includes(kw)) return false;
        const t = toTs(String(r.callback_time || ''));
        if (s !== null && (t === null || t < s)) return false;
        if (e !== null && (t === null || t > e)) return false;
        return true;
      }).sort((a,b)=> (toTs(String(b.callback_time||''))||0) - (toTs(String(a.callback_time||''))||0));
    });

    onMounted(load);
    return {rows, keyword, startAt, endAt, filteredRows, load};
  }
}).mount('#app');
</script>
</body>
</html>
