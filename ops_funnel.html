<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>漏斗分析</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    html[data-embedded="1"] .oa-sidebar{display:none!important;}
    html[data-embedded="1"] .oa-layout{display:block!important;}
    html[data-embedded="1"] .oa-main{padding:12px 16px!important;}
    html[data-embedded="1"] .oa-header{position:static!important;padding-left:0!important;}
    html[data-embedded="1"] .header-actions a.btn-secondary{display:none!important;}
    html[data-embedded="1"] .menu-toggle,html[data-embedded="1"] .sidebar-overlay{display:none!important;}html[data-embedded="1"] .oa-header h1{display:none!important;}
  </style>
  <script>
    (function(){
      var p = new URLSearchParams(location.search);
      if (p.get("embedded") === "1") document.documentElement.setAttribute("data-embedded","1");
    })();
  </script>
</head>
<body>
<div id="app" class="oa-layout">
  <main class="oa-main">
    <header class="oa-header">
      <h1>漏斗分析</h1>
      <div class="header-actions">
        <button class="btn-secondary" @click="loadData">刷新</button>
        <button class="btn-danger" @click="logout">退出</button>
      </div>
    </header>
    <section class="content-card">
      <div v-if="error" class="error-message">{{ error }}</div>
      <div v-if="loading" class="loading">加载中...</div>
      <table v-if="!loading && items.length > 0" class="data-table">
        <thead>
          <tr>
            <th>漏斗阶段</th>
            <th>当期数量</th>
            <th>上期数量</th>
            <th>转化率(%)</th>
            <th>流失率(%)</th>
            <th>环比变化(%)</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="item in items" :key="item.stage">
            <td>{{ item.stage }}</td>
            <td>{{ item.current }}</td>
            <td>{{ item.previous }}</td>
            <td>{{ item.conversion }}</td>
            <td>{{ item.dropoff }}</td>
            <td :class="{ 'positive': item.change > 0, 'negative': item.change < 0 }">{{ item.change }}</td>
            <td><button class="btn-small" @click="viewDetail(item)">查看详情</button></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</div>
<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
  setup() {
    const items = ref([]);
    const error = ref('');
    const loading = ref(false);
    const api = async(url, opt={}) => {
      const token = localStorage.getItem('oa_token') || '';
      const headers = {'Content-Type':'application/json'};
      if (token) { headers['Authorization'] = 'Bearer ' + token; headers['X-OA-Token'] = token; }
      let r;
      try { r = await fetch(url, {...opt, headers}); }
      catch(e) { throw new Error('网络异常'); }
      const j = await r.json();
      if (r.status === 401) { localStorage.removeItem('oa_token'); top.location.href = './login.html'; throw new Error('登录过期'); }
      if (j.code !== 0) throw new Error(j.message || '请求失败');
      return j.data;
    };
    const loadData = async() => {
      error.value = '';
      loading.value = true;
      try {
        items.value = await api('/api/ops_funnel.php');
      } catch(e) {
        error.value = e.message;
      } finally {
        loading.value = false;
      }
    };
    const viewDetail = (item) => {
      alert('查看详情：' + item.stage + '\n当期：' + item.current + '\n上期：' + item.previous);
    };
    const logout = () => { localStorage.removeItem('oa_token'); localStorage.removeItem('oa_user'); top.location.href = './login.html'; };
    onMounted(async() => { if (!localStorage.getItem('oa_token')) { top.location.href = './login.html'; return; } await loadData(); });
    return { items, error, loading, loadData, viewDetail, logout };
  }
}).mount('#app');
</script>
</body>
</html>
