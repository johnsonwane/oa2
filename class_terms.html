<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>课程期次</title><link rel="stylesheet" href="./assets/style.css"/><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script></head>
<body><div id="app" class="oa-main" v-cloak>
  <header class="oa-header"><h1>课程期次</h1><div class="header-actions"><a class="btn-secondary" href="./todos.html">返回主入口</a><button @click="load">刷新</button></div></header>
  <section class="content-card"><p class="role-tip"><strong>模块说明：</strong>课程期次模块（Sprint123）已补齐，可直接新增、编辑、删除、查询。</p>
    <form class="inline-form" @submit.prevent="save">
        <label>course_id<input v-model="form.course_id" type="text"/></label>
        <label>term_name<input v-model="form.term_name" type="text"/></label>
        <label>start_date<input v-model="form.start_date" type="date"/></label>
        <label>end_date<input v-model="form.end_date" type="date"/></label>
        <label>headteacher_user_id<input v-model="form.headteacher_user_id" type="text"/></label>
        <label>status<input v-model="form.status" type="text"/></label>
        <button>{{form.id?'保存':'新增'}}</button><button type="button" class="btn-secondary" @click="reset">重置</button>
    </form>
    <table class="table"><thead><tr><th>id</th><th>course_id</th><th>term_name</th><th>start_date</th><th>end_date</th><th>headteacher_user_id</th><th>status</th><th>操作</th></tr></thead><tbody><tr v-for="row in list" :key="row.id"><td>{{row.id||"-"}}</td><td>{{row.course_id||"-"}}</td><td>{{row.term_name||"-"}}</td><td>{{row.start_date||"-"}}</td><td>{{row.end_date||"-"}}</td><td>{{row.headteacher_user_id||"-"}}</td><td>{{row.status||"-"}}</td><td><button class="btn-mini" @click="edit(row)">编辑</button><button class="btn-mini btn-danger" @click="delRow(row.id)">删除</button></td></tr></tbody></table>
    <p v-if="error" class="error">{{error}}</p>
  </section></div>
<script>
const {createApp,ref,reactive,onMounted} = Vue;
createApp({setup(){
  const list=ref([]),error=ref('');
  const form=reactive({id:0,course_id:'',term_name:'',start_date:'',end_date:'',headteacher_user_id:'',status:''});
  const api='/api/class_terms.php';
  const req=async(url,opt={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch(_ ){}if(!r.ok||j.code!==0) throw new Error(j.message||'请求失败');return j.data;};
  const load=async()=>{try{error.value='';list.value=await req(api)}catch(e){error.value=e.message}};
  const reset=()=>{form.course_id='';form.term_name='';form.start_date='';form.end_date='';form.headteacher_user_id='';form.status='';form.id=0;};
  const save=async()=>{try{error.value='';if(form.id){await req(api,{method:'PUT',body:JSON.stringify(form)})}else{await req(api,{method:'POST',body:JSON.stringify(form)})}reset();await load();}catch(e){error.value=e.message}};
  const edit=(row)=>{form.id=Number(row.id)||0;Object.assign(form,{course_id: row.course_id ?? '' ,
      term_name: row.term_name ?? '' ,
      start_date: row.start_date ?? '' ,
      end_date: row.end_date ?? '' ,
      headteacher_user_id: row.headteacher_user_id ?? '' ,
      status: row.status ?? '' ,});};
  const delRow=async(id)=>{if(!confirm('确认删除?'))return;try{await req(api+'?id='+id,{method:'DELETE'});await load();}catch(e){error.value=e.message}};
  onMounted(load); return {list,error,form,load,reset,save,edit,delRow};
}}).mount('#app');
</script></body></html>
