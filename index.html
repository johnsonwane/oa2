<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OA-1.0.0</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <style>
    /* index.html 专属布局，由 style.css 提供基础样式 */
    .content-shell{flex:1;display:flex;flex-direction:column;min-width:0}
    .page-frame{flex:1;border:0;width:100%;background:transparent;border-top:1px solid var(--border)}
  </style>
</head>
<body>
<div class="app-shell">
  <!-- 移动端遮罩层 -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <!-- 汉堡按钮（仅 ≤979px 可见） -->
  <button class="menu-toggle" id="menuToggle" aria-label="展开菜单">
    <span></span><span></span><span></span>
  </button>
  <aside class="oa-sidebar" id="sidebar">
    <div class="brand">OA-1.0.0</div>
    <div class="user-box" id="userBox">未登录</div>
    <!-- 菜单由 JS 动态渲染 -->
    <div id="sidebarMenu">
      <div class="menu-skeleton">
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      </div>
    </div>
  </aside>
  <div class="content-shell">
    <header class="oa-header">
      <h1 id="pageTitle">OA 系统管理台</h1>
      <div class="header-actions">
        <button class="btn-secondary" id="refreshBtn">刷新当前页</button>
        <button class="btn-danger" id="logoutBtn">退出登录</button>
      </div>
    </header>
    <iframe id="pageFrame" class="page-frame" src="about:blank"></iframe>
  </div>
</div>
<script>
// ── 页面跳转映射（menu_key → html文件）──────────────────────────────────
const pageMap = {
  overview:'overview.html', students:'students.html', courses:'courses.html',
  orders:'orders.html', referrers:'referrers.html',
  external_contacts:'external_contacts.html',
  external_contacts_local:'external_contacts_local.html',
  external_contacts_local_notes:'external_contacts_local_account_notes.html',
  receipts:'receipts.html', delivery_logs:'delivery_logs.html',
  department_stats:'department_stats.html', leads_funnel:'leads_funnel.html',
  boss_dashboard:'boss_dashboard.html', finance:'finance.html',
  todos:'todos.html', notifications:'notifications.html',
  users:'users.html', departments:'departments.html', menus:'menus.html',
  rbac_groups:'rbac_groups.html', rbac_permissions:'rbac_permissions.html',
  rbac_assign:'rbac_assign.html',
  materials:'materials.html', material_campaigns:'material_campaigns.html',
  material_claims:'material_claims.html',
  contracts:'contracts.html', invoice_profiles:'invoice_profiles.html',
  invoices:'invoices.html', class_terms:'class_terms.html',
  student_terms:'student_terms.html', shipments:'shipments.html',
  certificate_templates:'certificate_templates.html',
  certificate_issues:'certificate_issues.html',
  commission_scopes:'commission_scopes.html',
  commission_rules:'commission_rules.html',
  commission_calcs:'commission_calcs.html',
  commission_adjustments:'commission_adjustments.html',
  payroll_periods:'payroll_periods.html', payroll_slips:'payroll_slips.html',
  payment_callback_logs:'payment_callback_logs.html',
  refund_requests:'refund_requests.html',
};

let currentKey = '';
const frame    = document.getElementById('pageFrame');
const titleEl  = document.getElementById('pageTitle');
const userBox  = document.getElementById('userBox');
const sidebar  = document.getElementById('sidebar');
const overlay  = document.getElementById('sidebarOverlay');
const toggle   = document.getElementById('menuToggle');

// ── 移动端抽屉侧边栏 ─────────────────────────────────────────────────────
const openSidebar  = () => { sidebar.classList.add('open'); overlay.classList.add('show'); toggle.classList.add('open'); };
const closeSidebar = () => { sidebar.classList.remove('open'); overlay.classList.remove('show'); toggle.classList.remove('open'); };
toggle.addEventListener('click', () => sidebar.classList.contains('open') ? closeSidebar() : openSidebar());
overlay.addEventListener('click', closeSidebar);
// 切换页面时自动关闭抽屉
const select = (k) => {
  const file = pageMap[k];
  if (!file) return;
  currentKey = k;
  frame.src = './' + file + '?embedded=1';
  titleEl.textContent = document.querySelector(`[data-key="${k}"]`)?.textContent?.trim() || 'OA 系统管理台';
  history.replaceState(null, '', './index.html?page=' + k);
  document.querySelectorAll('.menu-tree li').forEach(li =>
    li.classList.toggle('active', li.dataset.key === k)
  );
  closeSidebar();
};

// ── 动态渲染侧边栏菜单 ────────────────────────────────────────────────────
const renderSidebar = (menus) => {
  const container = document.getElementById('sidebarMenu');
  if (!menus || menus.length === 0) {
    container.innerHTML = '<div class="no-perm-tip">暂无可用菜单</div>';
    return;
  }

  // 按 parent_name 分组
  const groups = {};
  menus.forEach(m => {
    const p = m.parent_name || '其他';
    (groups[p] = groups[p] || []).push(m);
  });

  let html = '';
  Object.keys(groups).forEach(groupName => {
    html += `<div class="group-title">${groupName}</div>`;
    html += `<ul class="menu-tree simple">`;
    groups[groupName].forEach(m => {
      // 只有 pageMap 里有对应 html 的菜单才渲染
      if (pageMap[m.menu_key]) {
        html += `<li data-key="${m.menu_key}">${m.menu_name}</li>`;
      }
    });
    html += `</ul>`;
  });

  container.innerHTML = html;

  // 绑定点击事件
  container.querySelectorAll('.menu-tree li').forEach(li =>
    li.addEventListener('click', () => select(li.dataset.key))
  );

  // 高亮当前激活项
  if (currentKey) {
    container.querySelectorAll('.menu-tree li').forEach(li =>
      li.classList.toggle('active', li.dataset.key === currentKey)
    );
  }
};

// ── 初始化 ────────────────────────────────────────────────────────────────
(async () => {
  const token = localStorage.getItem('oa_token');
  if (!token) { top.location.href = './login.html'; return; }

  // 显示用户名
  let user = {};
  try { user = JSON.parse(localStorage.getItem('oa_user') || '{}'); } catch (_) {}
  if (user.real_name || user.username) {
    userBox.textContent = `${user.real_name || user.username}（${user.role || '访客'}）`;
  }

  // 确定要加载的页面 key
  const params = new URLSearchParams(location.search);
  currentKey = params.get('page') || 'todos';

  // 先加载目标页
  const file = pageMap[currentKey];
  if (file) {
    frame.src = './' + file + '?embedded=1';
    titleEl.textContent = currentKey; // 先显示 key，待菜单加载后更新
    history.replaceState(null, '', './index.html?page=' + currentKey);
  }

  // 动态拉取该用户有权限的菜单
  if (user.id) {
    try {
      const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, 'X-OA-Token': token };
      const resp = await fetch(`/api/user_menus.php?user_id=${user.id}`, { headers });
      if (resp.status === 401) { localStorage.removeItem('oa_token'); top.location.href = './login.html'; return; }
      const j = await resp.json();
      if (j.code === 0 && Array.isArray(j.data)) {
        renderSidebar(j.data);
        // 更新页面标题
        const curMenu = j.data.find(m => m.menu_key === currentKey);
        if (curMenu) titleEl.textContent = curMenu.menu_name;
      } else {
        renderSidebar([]);
      }
    } catch (e) {
      // 网络异常时降级展示无权限提示
      document.getElementById('sidebarMenu').innerHTML =
        '<div class="no-perm-tip">菜单加载失败，请刷新重试</div>';
    }
  } else {
    // 无 user.id（老版本 token），降级展示最小菜单
    renderSidebar([{ menu_key: 'todos', menu_name: '待办', parent_name: '总览' }]);
  }
})();

// ── 操作按钮 ──────────────────────────────────────────────────────────────
document.getElementById('refreshBtn').addEventListener('click', () => {
  try { frame.contentWindow.location.reload(); } catch (_) { frame.src = frame.src; }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  const token = localStorage.getItem('oa_token') || '';
  try {
    if (token) {
      await fetch('/api/logout.php', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'X-OA-Token': token } });
    }
  } catch (_) {}
  localStorage.removeItem('oa_token');
  localStorage.removeItem('oa_user');
  top.location.href = './login.html';
});
</script>
</body>
</html>
