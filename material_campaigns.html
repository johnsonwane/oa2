<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>引流活动</title><link rel="stylesheet" href="./assets/style.css"/><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script></head>
<body><div id="app" class="oa-main" v-cloak>
  <header class="oa-header"><h1>引流活动</h1><div class="header-actions"><a class="btn-secondary" href="./todos.html">返回主入口</a><button @click="load">刷新</button></div></header>
  <section class="content-card"><p class="role-tip"><strong>模块说明：</strong>引流活动模块（Sprint123）已补齐，可直接新增、编辑、删除、查询。</p>
    <form class="inline-form" @submit.prevent="save">
        <label>material_id<input v-model="form.material_id" type="text"/></label>
        <label>channel<input v-model="form.channel" type="text"/></label>
        <label>campaign_name<input v-model="form.campaign_name" type="text"/></label>
        <label>consultant_user_id<input v-model="form.consultant_user_id" type="text"/></label>
        <label>landing_url<input v-model="form.landing_url" type="text"/></label>
        <label>status<input v-model="form.status" type="text"/></label>
        <button>{{form.id?'保存':'新增'}}</button><button type="button" class="btn-secondary" @click="reset">重置</button>
    </form>
    <table class="table"><thead><tr><th>id</th><th>material_id</th><th>channel</th><th>campaign_name</th><th>consultant_user_id</th><th>landing_url</th><th>status</th><th>操作</th></tr></thead><tbody><tr v-for="row in list" :key="row.id"><td>{{row.id||"-"}}</td><td>{{row.material_id||"-"}}</td><td>{{row.channel||"-"}}</td><td>{{row.campaign_name||"-"}}</td><td>{{row.consultant_user_id||"-"}}</td><td>{{row.landing_url||"-"}}</td><td>{{row.status||"-"}}</td><td><button class="btn-mini" @click="edit(row)">编辑</button><button class="btn-mini btn-danger" @click="delRow(row.id)">删除</button></td></tr></tbody></table>
    <p v-if="error" class="error">{{error}}</p>
  </section></div>
<script>
const {createApp,ref,reactive,onMounted} = Vue;
createApp({setup(){
  const list=ref([]),error=ref('');
  const form=reactive({id:0,material_id:'',channel:'',campaign_name:'',consultant_user_id:'',landing_url:'',status:''});
  const api='/api/material_campaigns.php';
  const req=async(url,opt={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch(_ ){}if(!r.ok||j.code!==0) throw new Error(j.message||'请求失败');return j.data;};
  const load=async()=>{try{error.value='';list.value=await req(api)}catch(e){error.value=e.message}};
  const reset=()=>{form.material_id='';form.channel='';form.campaign_name='';form.consultant_user_id='';form.landing_url='';form.status='';form.id=0;};
  const save=async()=>{try{error.value='';if(form.id){await req(api,{method:'PUT',body:JSON.stringify(form)})}else{await req(api,{method:'POST',body:JSON.stringify(form)})}reset();await load();}catch(e){error.value=e.message}};
  const edit=(row)=>{form.id=Number(row.id)||0;Object.assign(form,{material_id: row.material_id ?? '' ,
      channel: row.channel ?? '' ,
      campaign_name: row.campaign_name ?? '' ,
      consultant_user_id: row.consultant_user_id ?? '' ,
      landing_url: row.landing_url ?? '' ,
      status: row.status ?? '' ,});};
  const delRow=async(id)=>{if(!confirm('确认删除?'))return;try{await req(api+'?id='+id,{method:'DELETE'});await load();}catch(e){error.value=e.message}};
  onMounted(load); return {list,error,form,load,reset,save,edit,delRow};
}}).mount('#app');
</script></body></html>
