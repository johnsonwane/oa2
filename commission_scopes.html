<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>分成作用范围</title><link rel="stylesheet" href="./assets/style.css"/><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script></head>
<body><div id="app" class="oa-main" v-cloak>
  <header class="oa-header"><h1>分成作用范围</h1><div class="header-actions"><a class="btn-secondary" href="./todos.html">返回主入口</a><button @click="load">刷新</button></div></header>
  <section class="content-card"><p class="role-tip"><strong>模块说明：</strong>分成作用范围模块（Sprint123）已补齐，可直接新增、编辑、删除、查询。</p>
    <form class="inline-form" @submit.prevent="save">
        <label>rule_id<input v-model="form.rule_id" type="text"/></label>
        <label>scope_type<input v-model="form.scope_type" type="text"/></label>
        <label>scope_value<input v-model="form.scope_value" type="text"/></label>
        <button>{{form.id?'保存':'新增'}}</button><button type="button" class="btn-secondary" @click="reset">重置</button>
    </form>
    <table class="table"><thead><tr><th>id</th><th>rule_id</th><th>scope_type</th><th>scope_value</th><th>操作</th></tr></thead><tbody><tr v-for="row in list" :key="row.id"><td>{{row.id||"-"}}</td><td>{{row.rule_id||"-"}}</td><td>{{row.scope_type||"-"}}</td><td>{{row.scope_value||"-"}}</td><td><button class="btn-mini" @click="edit(row)">编辑</button><button class="btn-mini btn-danger" @click="delRow(row.id)">删除</button></td></tr></tbody></table>
    <p v-if="error" class="error">{{error}}</p>
  </section></div>
<script>
const {createApp,ref,reactive,onMounted} = Vue;
createApp({setup(){
  const list=ref([]),error=ref('');
  const form=reactive({id:0,rule_id:'',scope_type:'',scope_value:''});
  const api='/api/commission_scopes.php';
  const req=async(url,opt={})=>{const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch(_ ){}if(!r.ok||j.code!==0) throw new Error(j.message||'请求失败');return j.data;};
  const load=async()=>{try{error.value='';list.value=await req(api)}catch(e){error.value=e.message}};
  const reset=()=>{form.rule_id='';form.scope_type='';form.scope_value='';form.id=0;};
  const save=async()=>{try{error.value='';if(form.id){await req(api,{method:'PUT',body:JSON.stringify(form)})}else{await req(api,{method:'POST',body:JSON.stringify(form)})}reset();await load();}catch(e){error.value=e.message}};
  const edit=(row)=>{form.id=Number(row.id)||0;Object.assign(form,{rule_id: row.rule_id ?? '' ,
      scope_type: row.scope_type ?? '' ,
      scope_value: row.scope_value ?? '' ,});};
  const delRow=async(id)=>{if(!confirm('确认删除?'))return;try{await req(api+'?id='+id,{method:'DELETE'});await load();}catch(e){error.value=e.message}};
  onMounted(load); return {list,error,form,load,reset,save,edit,delRow};
}}).mount('#app');
</script></body></html>
