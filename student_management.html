<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学员管理</title>
  <link rel="stylesheet" href="./assets/style.css" />
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    html[data-embedded="1"] .oa-sidebar{display:none!important;}
    html[data-embedded="1"] .oa-layout{display:block!important;}
    html[data-embedded="1"] .oa-main{padding:12px 16px!important;}
    html[data-embedded="1"] .oa-header{position:static!important;padding-left:0!important;}
    html[data-embedded="1"] .header-actions a.btn-secondary{display:none!important;}
    html[data-embedded="1"] .menu-toggle,html[data-embedded="1"] .sidebar-overlay{display:none!important;}
    .table-container { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .data-table th, .data-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    .data-table th { background: #f9fafb; font-weight: 600; color: #374151; }
    .data-table tr:hover { background: #f9fafb; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-purple { background: #e9d5ff; color: #6b21a8; }
    .badge-gray { background: #f3f4f6; color: #4b5563; }
    .btn-sm { padding: 4px 12px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
    .btn-view { background: #3b82f6; color: white; }
    .btn-edit { background: #f59e0b; color: white; }
    .error-msg { color: #dc2626; padding: 12px; background: #fee2e2; border-radius: 6px; margin-bottom: 16px; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .search-bar input, .search-bar select { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
    .search-bar button { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
  <script>
    (function(){
      var p = new URLSearchParams(location.search);
      if (p.get("embedded") === "1") document.documentElement.setAttribute("data-embedded","1");
    })();
  </script>
</head>
<body>
<div id="app" class="oa-layout">
  <main class="oa-main">
    <header class="oa-header">
      <h1>学员管理</h1>
      <div class="header-actions">
        <button class="btn-secondary" @click="loadData">刷新</button>
        <button class="btn-danger" @click="logout">退出</button>
      </div>
    </header>
    <section class="content-card">
      <div class="search-bar">
        <input type="text" v-model="searchKeyword" placeholder="搜索学员姓名/手机号" />
        <select v-model="filterStage">
          <option value="">全部学习阶段</option>
          <option value="预习">预习</option>
          <option value="在读">在读</option>
          <option value="毕业">毕业</option>
          <option value="休学">休学</option>
          <option value="退学">退学</option>
        </select>
        <select v-model="filterStatus">
          <option value="">全部状态</option>
          <option value="正常">正常</option>
          <option value="异常">异常</option>
        </select>
        <button @click="loadData">搜索</button>
      </div>
      <div v-if="error" class="error-msg">{{ error }}</div>
      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>学员ID</th>
              <th>姓名</th>
              <th>性别</th>
              <th>年龄</th>
              <th>手机号</th>
              <th>所在课程</th>
              <th>班级</th>
              <th>班主任</th>
              <th>教练</th>
              <th>入学日期</th>
              <th>学习阶段</th>
              <th>状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in filteredItems" :key="item.student_id">
              <td>{{ item.student_id }}</td>
              <td>{{ item.name }}</td>
              <td>{{ item.gender }}</td>
              <td>{{ item.age }}</td>
              <td>{{ item.phone }}</td>
              <td>{{ item.course_name }}</td>
              <td>{{ item.class_name }}</td>
              <td>{{ item.teacher }}</td>
              <td>{{ item.coach }}</td>
              <td>{{ item.enroll_date }}</td>
              <td>
                <span class="badge" :class="getStageClass(item.stage)">{{ item.stage }}</span>
              </td>
              <td>
                <span class="badge" :class="item.status === '正常' ? 'badge-green' : 'badge-red'">{{ item.status }}</span>
              </td>
              <td>
                <button class="btn-sm btn-view" @click="viewStudent(item)">查看</button>
                <button class="btn-sm btn-edit" @click="editStudent(item)">编辑</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
<script>
const { createApp, ref, reactive, onMounted, computed } = Vue;
createApp({
  setup() {
    const items = ref([]);
    const error = ref('');
    const searchKeyword = ref('');
    const filterStage = ref('');
    const filterStatus = ref('');
    
    const api = async(url, opt={}) => {
      const token = localStorage.getItem('oa_token') || '';
      const headers = {'Content-Type':'application/json'};
      if (token) { headers['Authorization'] = 'Bearer ' + token; headers['X-OA-Token'] = token; }
      let r;
      try { r = await fetch(url, {...opt, headers}); }
      catch(e) { throw new Error('网络异常'); }
      const j = await r.json();
      if (r.status === 401) { localStorage.removeItem('oa_token'); top.location.href = './login.html'; throw new Error('登录过期'); }
      if (j.code !== 0) throw new Error(j.message || '请求失败');
      return j.data;
    };
    
    const loadData = async() => { 
      error.value = ''; 
      try { 
        items.value = await api('/api/student_management.php'); 
      } catch(e) { 
        error.value = e.message; 
      } 
    };
    
    const logout = () => { 
      localStorage.removeItem('oa_token'); 
      localStorage.removeItem('oa_user'); 
      top.location.href = './login.html'; 
    };
    
    const getStageClass = (stage) => {
      const map = { '预习': 'badge-yellow', '在读': 'badge-blue', '毕业': 'badge-green', '休学': 'badge-purple', '退学': 'badge-red' };
      return map[stage] || 'badge-gray';
    };
    
    const viewStudent = (item) => {
      alert('查看学员: ' + item.name);
    };
    
    const editStudent = (item) => {
      alert('编辑学员: ' + item.name);
    };
    
    const filteredItems = computed(() => {
      return items.value.filter(item => {
        const matchKeyword = !searchKeyword.value || 
          item.name.includes(searchKeyword.value) || 
          item.phone.includes(searchKeyword.value);
        const matchStage = !filterStage.value || item.stage === filterStage.value;
        const matchStatus = !filterStatus.value || item.status === filterStatus.value;
        return matchKeyword && matchStage && matchStatus;
      });
    });
    
    onMounted(async() => { 
      if (!localStorage.getItem('oa_token')) { 
        top.location.href = './login.html'; 
        return; 
      } 
      await loadData(); 
    });
    
    return { items, error, loadData, logout, searchKeyword, filterStage, filterStatus, filteredItems, getStageClass, viewStudent, editStudent };
  }
}).mount('#app');
</script>
</body>
</html>
